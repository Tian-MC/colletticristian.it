<!doctype html>
<!-- Modello per public/og/tian-it.jpg e tian-en.jpg: aprire con ?lang=it o ?lang=en a 1200x630 e salvare uno screenshot JPEG. -->
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Anteprima social · Tian</title>
    <style>
      @font-face {
        font-family: "Fraunces";
        src: url("../lib/fonts/fraunces-latin-normal.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
      }
      @font-face {
        font-family: "Fraunces";
        src: url("../lib/fonts/fraunces-latin-italic.woff2") format("woff2");
        font-weight: 100 900;
        font-style: italic;
      }
      @font-face {
        font-family: "Instrument Sans";
        src: url("../lib/fonts/instrument-sans-latin.woff2") format("woff2");
        font-weight: 400 700;
      }

      :root {
        --paper: oklch(0.975 0.009 305);
        --ink: oklch(0.23 0.045 296);
        --ink-soft: oklch(0.45 0.035 296);
        --ink-faint: oklch(0.53 0.03 298);
        --violet: oklch(0.51 0.21 292);
        --grape: oklch(0.6 0.2 294);
        --rose: oklch(0.66 0.2 358);
        --coral: oklch(0.72 0.16 40);
        --sun: oklch(0.84 0.15 82);
      }

      * { margin: 0; box-sizing: border-box; }

      html, body { width: 1200px; height: 630px; overflow: hidden; }

      body {
        position: relative;
        background:
          radial-gradient(600px 420px at 1040px 40px, oklch(0.8 0.12 295 / 0.55), transparent 70%),
          radial-gradient(560px 380px at 80px 640px, oklch(0.86 0.1 45 / 0.55), transparent 70%),
          radial-gradient(520px 360px at 980px 600px, oklch(0.86 0.08 190 / 0.5), transparent 70%),
          var(--paper);
        color: var(--ink);
        font-family: "Instrument Sans", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      svg.field, svg.thread { position: absolute; inset: 0; width: 100%; height: 100%; }

      .content {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 90px;
      }

      .logo {
        position: absolute;
        top: 58px;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-family: "Fraunces", serif;
        font-size: 44px;
        font-weight: 500;
        font-style: italic;
        font-variation-settings: "SOFT" 100, "WONK" 1;
        letter-spacing: -0.02em;
      }
      .logo svg { width: 50px; height: 32px; }

      h1 {
        font-family: "Fraunces", serif;
        font-weight: 360;
        font-size: 104px;
        line-height: 0.98;
        letter-spacing: -0.035em;
        font-variation-settings: "SOFT" 50, "WONK" 0;
        margin-top: 18px;
      }
      h1 em {
        font-style: italic;
        font-variation-settings: "SOFT" 100, "WONK" 1;
        background-image: linear-gradient(100deg, oklch(0.51 0.21 292) 5%, oklch(0.52 0.2 358) 55%, oklch(0.55 0.18 36) 95%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        padding-right: 0.12em;
        margin-right: -0.12em;
      }

      .lead {
        margin-top: 34px;
        font-size: 30px;
        font-weight: 500;
        color: var(--ink-soft);
        letter-spacing: -0.005em;
      }

      .url {
        position: absolute;
        bottom: 46px;
        left: 0;
        right: 0;
        font-size: 21px;
        letter-spacing: 0.06em;
        color: var(--ink-faint);
      }
    </style>
  </head>
  <body>
    <svg class="field" viewBox="0 0 1200 630" preserveAspectRatio="none" fill="none" aria-hidden="true">
      <g stroke="oklch(0.51 0.21 292)" stroke-opacity="0.09" stroke-width="1">
        <path d="M-40 70 C 250 40, 430 120, 630 70 S 1030 30, 1240 80" />
        <path d="M-40 130 C 250 100, 430 190, 630 130 S 1030 90, 1240 140" />
        <path d="M-40 190 C 250 160, 430 250, 630 190 S 1030 150, 1240 200" />
        <path d="M-40 250 C 250 220, 430 310, 630 250 S 1030 210, 1240 260" />
        <path d="M-40 310 C 250 280, 430 370, 630 310 S 1030 270, 1240 320" />
        <path d="M-40 370 C 250 340, 430 430, 630 370 S 1030 330, 1240 380" />
        <path d="M-40 430 C 250 400, 430 490, 630 430 S 1030 390, 1240 440" />
        <path d="M-40 490 C 250 460, 430 550, 630 490 S 1030 450, 1240 500" />
        <path d="M-40 550 C 250 520, 430 610, 630 550 S 1030 510, 1240 560" />
      </g>
    </svg>

    <svg class="thread" viewBox="0 0 1200 630" fill="none" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" x2="1200" y1="0" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="oklch(0.6 0.2 294)" />
          <stop offset="0.45" stop-color="oklch(0.66 0.2 358)" />
          <stop offset="0.8" stop-color="oklch(0.72 0.16 40)" />
          <stop offset="1" stop-color="oklch(0.84 0.15 82)" />
        </linearGradient>
      </defs>
      <path d="M-20 578 C 150 578, 260 532, 380 514 C 500 496, 560 530, 660 522 C 760 514, 820 472, 900 480 C 980 488, 1000 547, 955 554 C 910 561, 925 492, 1010 484 C 1090 476, 1150 474, 1230 460" stroke="url(#g)" stroke-width="18" stroke-linecap="round" opacity="0.14" />
      <path d="M-20 578 C 150 578, 260 532, 380 514 C 500 496, 560 530, 660 522 C 760 514, 820 472, 900 480 C 980 488, 1000 547, 955 554 C 910 561, 925 492, 1010 484 C 1090 476, 1150 474, 1230 460" stroke="url(#g)" stroke-width="3.2" stroke-linecap="round" />
    </svg>

    <div class="content">
      <div class="logo">
        <svg viewBox="0 0 28 18" fill="none" aria-hidden="true">
          <path d="M2 15 C 8 15, 11.5 4, 8 4 C 4.5 4, 5.5 15, 13 15 L 26 15" stroke="oklch(0.51 0.21 292)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>Tian</span>
      </div>

      <h1 id="title">Metto ordine<br />nel tuo <em>digitale.</em></h1>
      <p class="lead" id="lead">Informatico a Parma · siti web, gestionali e soluzioni digitali</p>
      <p class="url">colletticristian.it</p>
    </div>

    <script>
      if (new URLSearchParams(location.search).get("lang") === "en") {
        document.documentElement.lang = "en";
        document.getElementById("title").innerHTML = "Your digital world,<br /><em>untangled.</em>";
        document.getElementById("lead").textContent = "Web developer in Parma · websites, custom software and digital solutions";
      }
    </script>
  </body>
</html>
