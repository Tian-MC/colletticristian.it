# colletticristian.it: export statico di Next.js dietro Cloudflare (SSL Full strict).
# Il default_server sta in visualitalianproject.it.conf.

limit_req_zone $binary_remote_addr zone=colletticristian_contact:1m rate=6r/m;

map $uri $colletticristian_cache {
	~^/_next/static/      "public, max-age=31536000, immutable";
	~*\.(html|txt)$       "public, max-age=300";
	~^[^.]*$              "public, max-age=300";
	default               "";
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name colletticristian.it;

	ssl_certificate     /etc/ssl/cloudflare/colletticristian.pem;
	ssl_certificate_key /etc/ssl/cloudflare/colletticristian.key;

	include snippets/cloudflare-realip.conf;

	root /var/www/colletticristian.it;
	index index.html;

	absolute_redirect off;

	# Niente add_header nelle location: cancellerebbe tutti questi.
	add_header Cache-Control $colletticristian_cache;

	add_header Strict-Transport-Security "max-age=31536000" always;

	add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

	add_header X-Frame-Options "DENY" always;
	add_header Cross-Origin-Opener-Policy "same-origin" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

	location / {
		try_files $uri $uri.html $uri/ =404;
	}

	# /privacy/ -> /privacy (la cartella con lo stesso nome darebbe 403)
	location ~ ^(.+)/$ {
		return 301 $1;
	}

	error_page 404 /404.html;

	location = /api/contact {
		limit_req zone=colletticristian_contact burst=5 nodelay;
		limit_req_status 429;
		client_max_body_size 16k;

		proxy_pass http://127.0.0.1:8790;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
	}

	gzip on;
	gzip_vary on;
	gzip_comp_level 6;
	gzip_types text/css application/javascript application/json image/svg+xml
	           application/xml text/xml text/plain;

	access_log /var/log/nginx/colletticristian.it.access.log;
	error_log  /var/log/nginx/colletticristian.it.error.log;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name www.colletticristian.it;

	ssl_certificate     /etc/ssl/cloudflare/colletticristian.pem;
	ssl_certificate_key /etc/ssl/cloudflare/colletticristian.key;

	add_header Strict-Transport-Security "max-age=31536000" always;
	return 301 https://colletticristian.it$request_uri;
}

server {
	listen 80;
	listen [::]:80;
	server_name colletticristian.it www.colletticristian.it;

	return 301 https://colletticristian.it$request_uri;
}
