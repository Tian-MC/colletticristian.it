log-format COMBINED

tz Europe/Rome

anonymize-ip true

ignore-crawlers true
unknowns-as-crawlers true

no-query-string true

ignore-statics req
static-file .css
static-file .js
static-file .map
static-file .json
static-file .txt
static-file .xml
static-file .webp
static-file .png
static-file .jpg
static-file .jpeg
static-file .gif
static-file .svg
static-file .ico
static-file .woff
static-file .woff2
static-file .ttf

# hide-referrer e non ignore-referrer, che scarta le richieste
hide-referrer colletticristian.it
hide-referrer www.colletticristian.it

ignore-panel VIRTUAL_HOSTS
ignore-panel REMOTE_USER
ignore-panel KEYPHRASES
ignore-panel REFERRERS
ignore-panel CACHE_STATUS
ignore-panel TLS_TYPE

html-report-title Statistiche - colletticristian.it
html-prefs {"theme":"bright","perPage":10}
real-os true
no-progress true

# circa 13 mesi, come nella privacy
keep-last 400
